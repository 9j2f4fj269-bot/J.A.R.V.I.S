[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "1.0.0"
description = "A Jarvis-style personal agent with real tools: web, YouTube, GitHub, code execution, memory."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12",
    "pypdf>=5.0"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]
